function indicadores(s){const P={'Python ind. 3':[],'Python ind. 4':[],'BD ind. 4':[],'BD ind. 5':[],'BD ind. 6':[],'Redes ind. 4':[],'Redes ind. 5':[]};const mapa={'Python 3':'Python ind. 3','Python 4':'Python ind. 4','BD 4':'BD ind. 4','BD 5':'BD ind. 5','BD 6':'BD ind. 6','Redes 4':'Redes ind. 4','Redes 5':'Redes ind. 5'};

const REPO='gtosilva89/aquecimento',PASTA='respostas',API='https://api.github.com/repos/'+REPO+'/contents/';

const obf=t=>btoa(t.split('').reverse().join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

 const k=await sub.generateKey({name:'AES-GCM',length:256},true,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
 const dados={...s};delete dados.sujo;
 const ct=await sub.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(dados)));
 const ek=await sub.encrypt({name:'RSA-OAEP'},pub,await sub.exportKey('raw',k));
 return{jogo:JOGO,v:1,id:await idArquivo(s),ts:Date.now(),ek:ab64(ek),iv:ab64(iv),ct:ab64(ct)}}

  const r=await gh(caminho,{token,method:'PUT',body:{message:msg,content:conteudoB64,...(sha?{sha}:{})}});
